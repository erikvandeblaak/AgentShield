# cargo-deny configuration (CI: `cargo deny check`).
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # chrono is unmaintained (no known vulnerability). It is used for timestamps in the event model,
    # audit log and IPC (serde formats); replacing it with jiff/time is tracked in docs/TECHNICAL_DEBT.md.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained, no vulnerability; migration tracked in TECHNICAL_DEBT.md" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
